[package]
name = "mcp-assessment"
version = "1.0.0"
edition = "2024"
authors = ["James Karanja <james.karanja@zavora.ai>"]
description = "Assessment MCP Server — an assessment platform (item bank with multiple item types, standards/curriculum alignment, assessment authoring + blueprint-driven generation, rubric scoring, attempts with auto-grading, and psychometric analytics including item difficulty/discrimination and standard mastery) with a full audit trail"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-assessment"
homepage = "https://enterprise.adk-rust.com"
keywords = ["mcp", "assessment", "education", "psychometrics", "grading"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
adk-mcp-sdk = "0.1"
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

[workspace]
