<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#0891b2"/><stop offset="100%" style="stop-color:#4f46e5"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="780" height="470" fill="#f8fafc" rx="12"/>
  <rect x="240" y="10" width="300" height="28" rx="8" fill="url(#hg)"/>
  <text x="390" y="29" text-anchor="middle" fill="white" font-size="12" font-weight="bold">mcp-assessment — Assessment Platform</text>

  <!-- agents -->
  <rect x="40" y="48" width="700" height="42" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="390" y="62" text-anchor="middle" font-size="9" font-weight="bold" fill="#155e75">Education Agents (clients of the assessment platform)</text>
  <text x="390" y="79" text-anchor="middle" font-size="7" fill="#0e7490">Quiz Generator · Curriculum Mapping · Instructor Copilot · Rubric Grading Assistant · Adaptive Tutor</text>
  <line x1="390" y1="90" x2="390" y2="106" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- tools -->
  <rect x="30" y="110" width="720" height="120" rx="10" fill="white" stroke="#4f46e5" stroke-width="2"/>
  <rect x="30" y="110" width="720" height="22" rx="10" fill="url(#hg)"/>
  <text x="390" y="125" text-anchor="middle" fill="white" font-size="10" font-weight="bold">23 Tools — assessment platform</text>
  <g font-size="7.2" font-weight="bold" fill="#155e75" text-anchor="middle">
    <text x="100" y="148">Standards (3)</text>
    <text x="240" y="148">Item Bank (3)</text>
    <text x="385" y="148">Assessments (6)</text>
    <text x="535" y="148">Attempts (6)</text>
    <text x="680" y="148">Analytics (3)</text>
  </g>
  <g font-size="6.3" fill="#3730a3" text-anchor="middle">
    <text x="100" y="163">add · list</text>
    <text x="100" y="173">items_for_standard</text>
    <text x="240" y="163">create_item · get</text>
    <text x="240" y="173">list (6 types)</text>
    <text x="385" y="163">create · generate</text>
    <text x="385" y="173">status* · blueprint</text>
    <text x="535" y="163">start · submit*†</text>
    <text x="535" y="173">score_rubric · get</text>
    <text x="680" y="163">item_analysis</text>
    <text x="680" y="173">standard_mastery</text>
  </g>
  <g font-size="7.2" font-weight="bold" fill="#155e75" text-anchor="middle">
    <text x="200" y="196">Rubrics (2)</text>
    <text x="420" y="196">+ list / learner attempts · audit_log</text>
  </g>
  <g font-size="6.3" fill="#3730a3" text-anchor="middle">
    <text x="200" y="210">create_rubric · get_rubric</text>
  </g>
  <text x="390" y="224" text-anchor="middle" font-size="6" fill="#64748b">* requires approval   † external write (records result)</text>
  <line x1="390" y1="230" x2="390" y2="246" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- engines -->
  <rect x="30" y="250" width="720" height="86" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="390" y="265" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">Domain engines</text>
  <g font-size="7" fill="#78350f" text-anchor="middle">
    <text x="130" y="284" font-weight="bold">Blueprint gen</text>
    <text x="130" y="296">difficulty → count</text>
    <text x="130" y="307">over item bank</text>
    <text x="320" y="284" font-weight="bold">Auto-grading</text>
    <text x="320" y="296">objective by type +</text>
    <text x="320" y="307">rubric (clamped)</text>
    <text x="510" y="284" font-weight="bold">Item analysis</text>
    <text x="510" y="296">p-value + top/bottom</text>
    <text x="510" y="307">third discrimination</text>
    <text x="675" y="284" font-weight="bold">Mastery</text>
    <text x="675" y="296">points per standard</text>
    <text x="675" y="307">→ proficiency level</text>
  </g>
  <line x1="390" y1="336" x2="390" y2="352" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- store -->
  <rect x="30" y="356" width="720" height="62" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="390" y="372" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">In-memory store (thread-safe) + append-only audit trail</text>
  <g font-size="6.6" fill="#475569" text-anchor="middle">
    <text x="390" y="389">standards · rubrics · items · assessments · attempts · responses · audit_log</text>
    <text x="390" y="402" fill="#64748b">STD · RUB · ITM · ASM · ATT</text>
  </g>

  <text x="390" y="440" text-anchor="middle" font-size="8" fill="#0891b2" font-weight="bold">adk-mcp-sdk · rmcp 1.7 · stdio transport · registry-ready manifest</text>
  <text x="390" y="456" text-anchor="middle" font-size="7" fill="#94a3b8">Apache-2.0 · zavora-ai/mcp-assessment</text>
</svg>
